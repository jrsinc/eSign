<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Method 365 – offline</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="center-box card" style="max-width:460px;text-align:center">
    <img src="/brand/method365-logo.svg" alt="Method 365" style="height:64px;margin-bottom:12px">
    <h1>Can't reach the Method 365 server</h1>
    <p class="muted">Check your internet connection. If it's working, the Method 365 server may be switched off or restarting; contact your administrator.</p>
    <p class="small muted">No agreements are stored on this device, so nothing is lost.</p>
    <button class="primary" id="retry">Try again</button>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
