<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eSign – offline</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="center-box card" style="max-width:460px;text-align:center">
    <img src="/logo.png" alt="Logo" style="height:48px;margin-bottom:12px">
    <h1>Can't reach the eSign server</h1>
    <p class="muted">Check your internet connection. If it's working, the eSign server may be switched off or restarting; contact your administrator.</p>
    <p class="small muted">No agreements are stored on this device, so nothing is lost.</p>
    <button class="primary" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Reconnect automatically when the network comes back.
    window.addEventListener('online', () => location.reload());
    setInterval(() => fetch('/', { method: 'HEAD', cache: 'no-store' }).then((r) => r.ok && location.reload()).catch(() => {}), 15000);
  </script>
</body>
</html>
