<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Set your password</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1e63b5">
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top"><div class="logo"><img src="/logo.png" alt="Logo" style="height:32px"></div></header>
  <main class="center-box card" style="max-width:440px" id="box"><p class="muted">Checking your link…</p></main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const token = new URLSearchParams(location.search).get('t') || '';
    // Keep the secret token out of the address bar and browser history once read.
    history.replaceState(null, '', '/account.html');
    const box = document.getElementById('box');
    (async () => {
      const r = await fetch(`/api/password/link-info?t=${encodeURIComponent(token)}`);
      const info = await r.json();
      if (!r.ok) {
        box.innerHTML = `<h1>Link not valid</h1><p class="muted">${esc(info.error)}</p><p><a class="btn primary" href="/">Go to sign in</a></p>`;
        return;
      }
      box.innerHTML = `
        <h1>${info.kind === 'invite' ? `Welcome, ${esc(info.name)}` : 'Choose a new password'}</h1>
        <p class="muted">${info.kind === 'invite' ? `Set a password for your ${esc(info.company)} eSign account.` : 'Choose a new password for your account.'}<br>Your sign-in ID is <strong>${esc(info.email)}</strong>.</p>
        <form id="f">
          <label for="p1">New password</label>
          <input id="p1" type="password" autocomplete="new-password" required autofocus>
          <label for="p2">Repeat the password</label>
          <input id="p2" type="password" autocomplete="new-password" required>
          <p class="small muted">At least 10 characters, with letters and numbers; not your name or email.</p>
          <p id="err" class="small" style="color:var(--danger)"></p>
          <button class="primary" style="width:100%">Save password</button>
        </form>`;
      document.getElementById('f').onsubmit = async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('p1').value;
        if (p1 !== document.getElementById('p2').value) return (document.getElementById('err').textContent = 'The two passwords are different.');
        const res = await fetch('/api/password/set', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, password: p1 }) });
        const out = await res.json();
        if (!res.ok) return (document.getElementById('err').textContent = out.error);
        box.innerHTML = `<h1>Password saved ✓</h1><p class="muted">Sign in with <strong>${esc(out.email)}</strong> and your new password. We'll email you a one-time code to finish signing in.</p><p><a class="btn primary" href="/">Go to sign in</a></p>`;
      };
    })();
  </script>
</body>
</html>
