<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify a signed document</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1e63b5">
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top"><div class="logo">Verify a signed document</div></header>
  <main class="wrap" style="max-width:720px">
    <div class="drop" id="drop"><strong>Drop a signed PDF here</strong> or click to choose one<input type="file" id="file" accept="application/pdf" hidden></div>
    <p class="small muted">Two checks: the file's SHA-256 fingerprint is compared with our records, and every digital signature inside the PDF is verified. Any change to the file, even one character, is detected.</p>
    <div id="result"></div>
  </main>
  <script src="/verify.js"></script>
</body>
</html>
