<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 400" width="1360" height="400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Method 365 — electronic signatures</title>
  <style>
    .word { fill: #1B2350; font-family: "Cormorant Garamond", "Cormorant", "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 600; font-size: 150px; letter-spacing: 1px; }
    .tag  { fill: #5A6185; font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 2px; }
    @media (prefers-color-scheme: dark) { .word { fill: #F5F2EA; } .tag { fill: #B9BED6; } }
  </style>

  <!-- Mark: nib-M, ivory on deep ink, scaled to 280px -->
  <g transform="translate(0 60) scale(0.2734)">
    <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#1B2350"/>
    <path fill="#F5F2EA" stroke="#F5F2EA" stroke-width="16" stroke-linejoin="round" fill-rule="evenodd"
      d="M232 752 L232 320 L296 272 L360 272 L512 488 L664 272 L728 272 L792 320 L792 752 L672 752 L672 470 L512 752 L352 470 L352 752 Z
         M494 654.8 A52 52 0 1 1 530 654.8 L512 752 Z"/>
    <!-- Ink line where the nib touches the page -->
    <path fill="#C2A26A" d="M392 800 C 470 788, 560 788, 632 796 C 560 806, 470 806, 392 800 Z"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="372" y="246">Method 365</text>

  <!-- Signature stroke: a tapered gold swash, like a signature line just drawn -->
  <path fill="#C2A26A" d="M376 296 C 560 276, 860 304, 1210 278 C 1232 276, 1246 278, 1252 282 C 1240 284, 1228 286, 1210 288 C 860 318, 560 290, 376 296 Z"/>

  <!-- Descriptor -->
  <text class="tag" x="378" y="352">Electronic signatures</text>
</svg>
