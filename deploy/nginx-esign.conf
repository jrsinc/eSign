# Nginx alternative to Caddy (Linux, without Docker). Put in /etc/nginx/sites-available/esign,
# link it into sites-enabled, then get a certificate:  sudo certbot --nginx -d esign.method365sign.com
server {
    listen 80;
    server_name esign.method365sign.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name esign.method365sign.com;

    # certbot fills in these two lines.
    ssl_certificate     /etc/letsencrypt/live/esign.method365sign.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esign.method365sign.com/privkey.pem;

    # Backups can be large when restoring.
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
